name: Dependency security remediation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'Run dependency security remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade patched runtime dependencies
        run: |
          npm install --save --package-lock-only --ignore-scripts \
            vinext@1.0.1 \
            react@19.2.8 \
            react-dom@19.2.8 \
            react-server-dom-webpack@19.2.8

      - name: Upgrade patched build dependencies
        run: |
          npm install --save-dev --package-lock-only --ignore-scripts \
            @cloudflare/vite-plugin@1.62.5 \
            vite@8.3.2 \
            wrangler@4.120.0

      - name: Remove unused vulnerable migration CLI
        run: npm uninstall --save-dev --package-lock-only --ignore-scripts drizzle-kit

      - name: Apply safe transitive audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Install remediated dependency graph
        run: npm ci

      - name: Require clean npm audit
        run: npm audit --audit-level=low

      - name: Run full system tests and build
        run: npm run build

      - name: Commit remediated manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency manifest changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Patch vulnerable dependencies [skip ci]'
          git push origin HEAD:main
